name: Test
on:
  - push
  - pull_request
concurrency:
  group: ${{ github.head_ref || github.sha }}-${{ github.workflow }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.ruby-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        ruby-version:
          - "3.3"
          - "3.4"
          - "4.0"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: "ranguba/groonga-client"
          path: "groonga-client"
      - name: Fix groonga-client path
        run: |
          mv groonga-client ../
      - uses: actions/checkout@v7
        with:
          repository: "ranguba/groonga-client-model"
          path: "groonga-client-model"
      - name: Fix groonga-client-model path
        run: |
          mv groonga-client-model ../
      - name: Install Groonga
        run: |
          sudo apt update
          sudo apt install -y -V ca-certificates lsb-release wget
          wget https://packages.groonga.org/ubuntu/groonga-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt install -y -V ./groonga-apt-source-latest-$(lsb_release --codename --short).deb
          sudo apt update
          sudo apt install -y -V groonga-bin
      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: ${{ matrix.ruby-version }}
          bundler-cache: true
      - name: Test
        run: |
          bin/rails test
